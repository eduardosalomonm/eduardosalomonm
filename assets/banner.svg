<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Eduardo Salomon — Obsessive builder">
  <rect width="1280" height="320" rx="16" fill="#0b0b0b"/>
